name: ci

# Continuously enforces the parity guarantee on the TS side: the vitest suites
# assert @getbourdon/* output equals the Python oracle's conformance fixtures, and
# the federation job proves the mirror actually interoperates with the live Python
# server. Without this, a change to bourdon-js could silently drift from the oracle.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  parity:
    name: build + typecheck + parity tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      # The conformance parity fixtures are produced by the Python oracle; the
      # vitest suites read them via BOURDON_CONFORMANCE_DIR.
      - name: Checkout the Python oracle (conformance fixtures)
        uses: actions/checkout@v4
        with:
          repository: getbourdon/bourdon
          path: _oracle
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm typecheck
      - name: Parity tests (TS == oracle fixtures)
        env:
          BOURDON_CONFORMANCE_DIR: ${{ github.workspace }}/_oracle/conformance
        run: pnpm test

  federation:
    name: live mixed-language federation (TS client ↔ Python server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout + install the Python oracle (the L6 server)
        uses: actions/checkout@v4
        with:
          repository: getbourdon/bourdon
          path: _oracle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the oracle (server extra -> fastmcp)
        working-directory: _oracle
        run: python -m pip install -e ".[server]"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Build the client (the smoke imports @getbourdon/client)
        run: pnpm --filter @getbourdon/client build
      - name: TS @getbourdon/client → live python -m core.l6_server
        env:
          BOURDON_CONFORMANCE_DIR: ${{ github.workspace }}/_oracle/conformance
        run: node scripts/federation-smoke.mjs
